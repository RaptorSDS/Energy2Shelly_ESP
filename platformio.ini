; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = .platformio
description = Firmware for ESP82xx/ESP32 for Shelly Emulator

[env]
monitor_speed = 115200

[lib_ESP32]
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.0
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.7.1
	emelianov/modbus-esp8266@^4.1.0

[lib_ESP32_S3_Display]
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.0
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.7.1
	emelianov/modbus-esp8266@^4.1.0
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.14.5

[lib_ESP32S3]
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.0
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.7.1
	emelianov/modbus-esp8266@^4.1.0
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.14.5

[lib_ESP8266]
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.0
	tzapu/WiFiManager@^2.0.17
	vshymanskyy/Preferences@^2.1.0
	esp32async/ESPAsyncWebServer@^3.7.1
	emelianov/modbus-esp8266@^4.1.0

[env:esp32-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
board_build.partitions = min_spiffs.csv
framework = arduino
lib_deps = ${lib_ESP32.lib_deps}
monitor_speed = ${env.monitor_speed}

[env:esp32-devkit-v4]
platform = espressif32
board = az-delivery-devkit-v4
board_build.partitions = min_spiffs.csv
framework = arduino
lib_deps = ${lib_ESP32.lib_deps}
monitor_speed = ${env.monitor_speed}

[env:esp32-d1-mini]
platform = espressif32
board = wemos_d1_mini32
board_build.partitions = min_spiffs.csv
framework = arduino
lib_deps = ${lib_ESP32.lib_deps}
monitor_speed = ${env.monitor_speed}

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = ${lib_ESP8266.lib_deps}
monitor_speed = ${env.monitor_speed}

[env:esp8266-d1-mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps = ${lib_ESP8266.lib_deps}
monitor_speed = ${env.monitor_speed}

[env:esp32-s3-geek]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3.0
    tzapu/WiFiManager@^2.0.17
    esp32async/ESPAsyncWebServer@^3.7.1
    emelianov/modbus-esp8266@^4.1.0
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

build_flags =
    ;-DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

    -DESP32_S3_GEEK_DISPLAY=1
    ; TFT_eSPI Config
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=8
    -DTFT_RST=9
    -DTFT_BL=7
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=27000000
    ; ========================================
    ; Display-Auswahl: Nur EINE Option aktiv!
    ; ========================================
    ; Option 1: ST7789 (135x240, Waveshare ESP32-S3 Geek Original)
    ;-DST7789_DRIVER=1
    ;-DTFT_WIDTH=135
    ;-DTFT_HEIGHT=240
    ;-DDISPLAY_TYPE=1
	; Option 2: ST7735 (128x160, Standard SPI TFT) - auskommentiert
    ;-DST7735_DRIVER=1
    ;-DTFT_WIDTH=135
    ;-DTFT_HEIGHT=240
    ;-DDISPLAY_TYPE=2

;board_build.arduino.memory_type = qio_opi